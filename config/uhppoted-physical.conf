# Linux host networking is used so UDP discovery broadcasts can reach the LAN.
bind.address = 0.0.0.0:0
broadcast.address = 255.255.255.255:60000

rest.http.enabled = true
rest.http.port = 8080
rest.https.enabled = false
rest.CORS.enabled = true

