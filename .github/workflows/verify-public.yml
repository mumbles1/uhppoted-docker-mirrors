name: Verify public GHCR images

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/verify-public.yml

permissions:
  contents: read

jobs:
  verify-httpd:
    runs-on: ubuntu-latest
    steps:
      - name: Remove registry credentials
        run: rm -f "$HOME/.docker/config.json"

      - name: Verify anonymous manifest and pull
        env:
          IMAGE: ghcr.io/mumbles1/uhppoted-httpd:latest
        run: |
          set -euo pipefail

          for attempt in 1 2 3 4 5 6; do
            if manifest="$(docker manifest inspect "$IMAGE")"; then
              break
            fi
            if [ "$attempt" -eq 6 ]; then
              exit 1
            fi
            sleep 10
          done

          platforms="$(jq -r '.manifests[].platform | "\(.os)/\(.architecture)\(if .variant then "/\(.variant)" else "" end)"' <<<"$manifest")"
          grep -Fxq 'linux/amd64' <<<"$platforms"
          grep -Fxq 'linux/arm64' <<<"$platforms"
          grep -Fxq 'linux/arm/v7' <<<"$platforms"

          docker pull "$IMAGE"
          docker image inspect "$IMAGE" --format '{{json .RepoDigests}}'
          printf '%s\n' "$platforms"
