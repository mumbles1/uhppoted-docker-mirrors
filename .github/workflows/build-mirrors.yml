name: Build UHPPOTED mirrors

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * 1"

permissions:
  contents: read
  packages: write

concurrency:
  group: uhppoted-mirrors-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.component }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: simulator
            repository: uhppoted-simulator
            package: uhppoted-simulator
          - component: REST API
            repository: uhppoted-rest
            package: uhppoted-rest
          - component: MQTT endpoint
            repository: uhppoted-mqtt
            package: uhppoted-mqtt
          - component: HTTP administration UI
            repository: uhppoted-httpd
            package: uhppoted-httpd

    steps:
      - name: Check out mirror metadata
        uses: actions/checkout@v4

      - name: Check out upstream source
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 "https://codeberg.org/uhppoted/${{ matrix.repository }}.git" upstream

          dockerfile="$(find upstream/docker -maxdepth 3 -type f -iname 'Dockerfile*' | sort | head -n 1)"
          if [ -z "$dockerfile" ]; then
            echo "No upstream Dockerfile was found under upstream/docker" >&2
            exit 1
          fi

          version="$(git -C upstream describe --tags --abbrev=0 2>/dev/null || true)"
          version="${version#v}"

          echo "dockerfile=$dockerfile" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "revision=$(git -C upstream rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.package }}
          labels: |
            org.opencontainers.image.title=UHPPOTED ${{ matrix.component }} temporary mirror
            org.opencontainers.image.description=Unofficial source-built temporary mirror of ${{ matrix.repository }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://codeberg.org/uhppoted/${{ matrix.repository }}
            org.opencontainers.image.revision=${{ steps.upstream.outputs.revision }}
            org.opencontainers.image.licenses=MIT
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
            type=raw,value=${{ steps.upstream.outputs.version }},enable=${{ steps.upstream.outputs.version != '' }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: ./upstream
          file: ./${{ steps.upstream.outputs.dockerfile }}
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.package }}
          cache-to: type=gha,mode=max,scope=${{ matrix.package }}
          provenance: mode=max
          sbom: true

