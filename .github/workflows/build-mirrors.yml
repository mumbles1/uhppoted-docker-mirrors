name: Build UHPPOTED mirrors

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * 1"

permissions:
  contents: read
  packages: write

concurrency:
  group: uhppoted-mirrors-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.service }} (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [simulator, rest, mqtt, httpd]
        arch: [amd64, arm64, armv7]

    steps:
      - name: Check out mirror metadata
        uses: actions/checkout@v4

      - name: Resolve component and architecture
        id: component
        shell: bash
        run: |
          set -euo pipefail

          case "${{ matrix.service }}" in
            simulator)
              repository="uhppoted-simulator"
              package="uhppoted-simulator"
              binary="uhppote-simulator"
              title="Simulator"
              source_ref="080e01f432e14f545e823304813985c292918cce"
              ;;
            rest)
              repository="uhppoted-rest"
              package="uhppoted-rest"
              binary="uhppoted-rest"
              title="REST API"
              source_ref="50c104daa286d23e462f66c79503c9ef8bff9b1d"
              ;;
            mqtt)
              repository="uhppoted-mqtt"
              package="uhppoted-mqtt"
              binary="uhppoted-mqtt"
              title="MQTT endpoint"
              source_ref="7153e37a33b942598f7c08281ee5ae01f80e8862"
              ;;
            httpd)
              repository="uhppoted-httpd"
              package="uhppoted-httpd"
              binary="uhppoted-httpd"
              title="HTTP administration UI"
              source_ref="a41d45d7c9ae22a33b3058868b5a2dd2d49c13fc"
              ;;
          esac

          case "${{ matrix.arch }}" in
            amd64)
              goarch="amd64"
              goarm=""
              platform="linux/amd64"
              ;;
            arm64)
              goarch="arm64"
              goarm=""
              platform="linux/arm64"
              ;;
            armv7)
              goarch="arm"
              goarm="7"
              platform="linux/arm/v7"
              ;;
          esac

          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "binary=$binary" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"
          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"
          echo "goarch=$goarch" >> "$GITHUB_OUTPUT"
          echo "goarm=$goarm" >> "$GITHUB_OUTPUT"
          echo "platform=$platform" >> "$GITHUB_OUTPUT"

      - name: Check out upstream source
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          git init upstream
          git -C upstream remote add origin "https://github.com/${{ github.repository_owner }}/${{ steps.component.outputs.repository }}.git"
          git -C upstream fetch --depth 1 origin "${{ steps.component.outputs.source_ref }}"
          git -C upstream checkout --detach FETCH_HEAD

          dockerfile=""

          for candidate in \
            upstream/docker/Dockerfile \
            upstream/docker/release/Dockerfile \
            upstream/docker/compose/Dockerfile
          do
            if [ -f "$candidate" ]; then
              dockerfile="$candidate"
              break
            fi
          done

          if [ -z "$dockerfile" ]; then
            dockerfile="$(find upstream/docker -maxdepth 3 -type f -iname 'Dockerfile*' ! -path '*/dev/*' | sort | head -n 1)"
          fi

          if [ -z "$dockerfile" ] && [ -f upstream/docker/dev/Dockerfile ]; then
            dockerfile="upstream/docker/dev/Dockerfile"
          fi

          if [ -z "$dockerfile" ]; then
            echo "No upstream Dockerfile was found under upstream/docker" >&2
            exit 1
          fi

          echo "dockerfile=$dockerfile" >> "$GITHUB_OUTPUT"
          echo "context=$(dirname "$dockerfile")" >> "$GITHUB_OUTPUT"
          echo "revision=$(git -C upstream rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache-dependency-path: upstream/go.sum

      - name: Compile target binary
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ steps.component.outputs.goarch }}
          GOARM: ${{ steps.component.outputs.goarm }}
        run: |
          set -euo pipefail
          output="$GITHUB_WORKSPACE/${{ steps.upstream.outputs.context }}/${{ steps.component.outputs.binary }}"
          cd upstream
          go build -trimpath -ldflags="-s -w" -o "$output" "./cmd/${{ steps.component.outputs.binary }}"
          test -x "$output"

      - name: Prepare HTTPD production assets
        if: matrix.service == 'httpd'
        shell: bash
        run: |
          set -euo pipefail
          context="${{ steps.upstream.outputs.context }}"

          rm -rf "$context/html"
          cp -R upstream/httpd/html "$context/html"

          test -d "$context/html"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ steps.component.outputs.package }}
          labels: |
            org.opencontainers.image.title=UHPPOTED ${{ steps.component.outputs.title }} maintained downstream
            org.opencontainers.image.description=Maintained source-built downstream image of ${{ steps.component.outputs.repository }}
            org.opencontainers.image.source=https://github.com/${{ github.repository_owner }}/${{ steps.component.outputs.repository }}
            org.opencontainers.image.url=https://codeberg.org/uhppoted/${{ steps.component.outputs.repository }}
            org.opencontainers.image.revision=${{ steps.upstream.outputs.revision }}
            org.opencontainers.image.licenses=MIT
          tags: |
            type=raw,value=staging-${{ github.run_id }}-${{ matrix.arch }}

      - name: Build and publish architecture image
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.upstream.outputs.context }}
          file: ${{ steps.upstream.outputs.dockerfile }}
          platforms: ${{ steps.component.outputs.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ steps.component.outputs.package }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ steps.component.outputs.package }}-${{ matrix.arch }}
          provenance: mode=max
          sbom: true

  manifest:
    name: Publish ${{ matrix.service }} manifest
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [simulator, rest, mqtt, httpd]

    steps:
      - name: Resolve package
        id: package
        shell: bash
        run: |
          case "${{ matrix.service }}" in
            simulator) echo "name=uhppoted-simulator" >> "$GITHUB_OUTPUT" ;;
            rest) echo "name=uhppoted-rest" >> "$GITHUB_OUTPUT" ;;
            mqtt) echo "name=uhppoted-mqtt" >> "$GITHUB_OUTPUT" ;;
            httpd) echo "name=uhppoted-httpd" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-platform manifest
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${{ github.repository_owner }}/${{ steps.package.outputs.name }}"
          short_sha="${GITHUB_SHA:0:7}"

          docker buildx imagetools create \
            --tag "$image:latest" \
            --tag "$image:sha-$short_sha" \
            --tag "$image:run-${{ github.run_number }}" \
            "$image:staging-${{ github.run_id }}-amd64" \
            "$image:staging-${{ github.run_id }}-arm64" \
            "$image:staging-${{ github.run_id }}-armv7"

      - name: Verify manifest platforms
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${{ github.repository_owner }}/${{ steps.package.outputs.name }}:latest"
          inspection="$(docker buildx imagetools inspect "$image")"
          echo "$inspection"
          grep -q 'linux/amd64' <<< "$inspection"
          grep -q 'linux/arm64' <<< "$inspection"
          grep -q 'linux/arm/v7' <<< "$inspection"

      - name: Verify anonymous pull
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${{ github.repository_owner }}/${{ steps.package.outputs.name }}:latest"
          docker logout ghcr.io
          docker pull "$image"
